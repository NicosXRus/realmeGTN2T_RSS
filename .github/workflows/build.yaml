name: Build Realme GT Neo 2T Kernel (SukiSU Ultra)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Имя defconfig-файла'
        required: true
        default: 'k6893v1_64_k419_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Clone Vendor Source & Fix Kconfigs
        run: |
          echo "1. Скачиваем репозиторий vendor-source..."
          git clone --depth=1 https://github.com/realme-kernel-opensource/realme_X7max_GTneo_GTneo2T-AndroidT-vendor-source vendor_tmp
          
          # Распаковываем vendor
          if [ -d "vendor_tmp/vendor" ]; then
            cp -r vendor_tmp/vendor .
          else
            cp -r vendor_tmp vendor
          fi
          rm -rf vendor_tmp

          # 2. Удаляем старый/битый kernel/sched_assist, если он существует
          rm -rf kernel/sched_assist

          # 3. Находим sched_assist и копируем его на нужное место
          SCHED_PATH=$(find vendor -type d -name "sched_assist" | head -n 1)
          if [ -n "$SCHED_PATH" ]; then
            echo "Найдена директория sched_assist: $SCHED_PATH"
            mkdir -p kernel
            cp -r "$SCHED_PATH" kernel/sched_assist
          else
            echo "sched_assist не найден, создаем пустую заглушку Kconfig..."
            mkdir -p kernel/sched_assist
            touch kernel/sched_assist/Kconfig
          fi

      - name: Setup Toolchain (Proton Clang)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang
          # Удаляем старый компоновщик ld, чтобы не конфликтовал с системным ld в Ubuntu
          rm -f toolchain/clang/bin/ld

      - name: Inject SukiSU Ultra Driver & Defconfig Parameters
        run: |
          # 1. Инжектим драйвер SukiSU Ultra
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

          # 2. Корректируем defconfig
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "::error::Файл $DEFCONFIG_PATH не найден! Проверьте путь."
            exit 1
          fi

          echo "" >> $DEFCONFIG_PATH
          echo "# SukiSU Ultra Flags" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KPROBES=n" >> $DEFCONFIG_PATH
          
          echo "Конфигурация SukiSU успешно применена к $DEFCONFIG_PATH"

      - name: Patch Missing OEM Files & Auto-Fix Kconfigs (Python Script)
        run: |
          cat << 'EOF' > fix_kconfigs.py
          import os
          import re
          import shutil

          # 1. Безопасное копирование вендорных модулей
          modules = [
              ("sched_assist", "kernel/sched_assist"),
              ("klockopt", "kernel/locking/klockopt"),
              ("rootguard", "arch/arm64/kernel/rootguard"),
              ("uxio_first", "block/uxio_first"),
              ("keventupload", "kernel/keventupload"),
              ("oplus_ion", "drivers/staging/android/mtk_ion/oplus_ion")
          ]

          for mod_name, target_path in modules:
              found_dir = None
              for root, dirs, files in os.walk("vendor"):
                  if mod_name in dirs:
                      found_dir = os.path.join(root, mod_name)
                      break
              
              if found_dir:
                  print(f"[VENDOR] Найдено {mod_name}: {found_dir} -> {target_path}")
                  if os.path.exists(target_path) or os.path.islink(target_path):
                      if os.path.isdir(target_path) and not os.path.islink(target_path):
                          shutil.rmtree(target_path)
                      else:
                          os.remove(target_path)
                  os.makedirs(os.path.dirname(target_path), exist_ok=True)
                  shutil.copytree(found_dir, target_path)

          # 1.5 Интеграция заголовочных файлов (Headers)
          print("[HEADERS] Поиск и слияние заголовочных файлов из vendor...")
          for root, dirs, files in os.walk("vendor"):
              if os.path.basename(root) == "include":
                  try:
                      shutil.copytree(root, "include", dirs_exist_ok=True)
                      print(f"[HEADERS] Успешное слияние: {root} -> include/")
                  except Exception:
                      pass
              
              if "sched_assist_mutex.h" in files:
                  src = os.path.join(root, "sched_assist_mutex.h")
                  dest_dir = "include/linux/sched_assist"
                  
                  # УМНАЯ ЗАЩИТА: удаляем файл/симлинк, если он мешает создать папку
                  if os.path.exists(dest_dir) or os.path.islink(dest_dir):
                      if not os.path.isdir(dest_dir):
                          os.remove(dest_dir)
                          
                  os.makedirs(dest_dir, exist_ok=True)
                  shutil.copy(src, os.path.join(dest_dir, "sched_assist_mutex.h"))
                  print(f"[HEADERS] Точечно скопирован: {src} -> {dest_dir}")

          # 2. Генерация заглушек для всех отсутствующих Kconfig
          print("[KCONFIG] Сканирование файлов конфигурации...")
          for root, dirs, files in os.walk("."):
              if any(ignored in root for ignored in ["out", ".git", "toolchain", "vendor_tmp"]):
                  continue
              for file in files:
                  if "Kconfig" in file:
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                              for line in f:
                                  match = re.search(r"^\s*(?:source|rsource)\s+[\"']?([^\"'\s\n]+)", line)
                                  if match:
                                      target_path = match.group(1).strip()
                                      if "$" in target_path:
                                          continue
                                      clean_path = os.path.normpath(target_path)
                                      if not os.path.exists(clean_path):
                                          print(f"[FIX-KCONF] Создаем заглушку: {clean_path}")
                                          
                                          # Защита пути Kconfig
                                          if os.path.exists(os.path.dirname(clean_path)) and not os.path.isdir(os.path.dirname(clean_path)):
                                              os.remove(os.path.dirname(clean_path))
                                              
                                          os.makedirs(os.path.dirname(clean_path), exist_ok=True)
                                          open(clean_path, "a").close()
                                          mf = os.path.join(os.path.dirname(clean_path), "Makefile")
                                          if not os.path.exists(mf):
                                              with open(mf, "w") as makefile:
                                                  makefile.write("obj-y := \nobj-m := \n")
                      except Exception:
                          pass

          # 3. УМНОЕ ИСПРАВЛЕНИЕ MAKEFILE
          print("[MAKEFILE] Сканирование Makefile на отсутствующие директории...")
          for root, dirs, files in os.walk("."):
              if any(ignored in root for ignored in ["out", ".git", "toolchain", "vendor_tmp"]):
                  continue
              if "Makefile" in files:
                  filepath = os.path.join(root, "Makefile")
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          for line in f:
                              if re.search(r'^\s*obj-[ym\$\(\)A-Z_a-z]+\s*\+=', line):
                                  parts = line.split("+=")[1].split()
                                  for part in parts:
                                      if part.endswith('/'):
                                          dir_name = part[:-1]
                                          target_dir = os.path.join(root, dir_name)
                                          if not os.path.exists(target_dir):
                                              print(f"[FIX-MAKE] Заглушаем отсутствующую папку: {target_dir}")
                                              
                                              # Защита пути Makefile
                                              if os.path.exists(target_dir) or os.path.islink(target_dir):
                                                  if not os.path.isdir(target_dir):
                                                      os.remove(target_dir)
                                                      
                                              os.makedirs(target_dir, exist_ok=True)
                                              with open(os.path.join(target_dir, "Makefile"), "w") as target_mf:
                                                  target_mf.write("obj-y := \nobj-m := \n")
                  except Exception:
                          pass
          EOF

          # Запуск скрипта
          python3 fix_kconfigs.py
          rm -f fix_kconfigs.py
      
      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          mkdir -p out
          
          echo "1. Самовосстанавливающаяся генерация .config..."
          COUNTER=0
          while true; do
            COUNTER=$((COUNTER+1))
            set +e
            yes "" | make O=out ARCH=arm64 ${{ github.event.inputs.defconfig }} > make_def.log 2>&1
            MAKE_STATUS=$?
            set -e
            
            if [ $MAKE_STATUS -eq 0 ]; then
              echo "✅ [Попытка $COUNTER] defconfig успешно сгенерирован!"
              break
            fi
            
            MISSING=$(grep -oP 'can.t open file "\K[^"]+' make_def.log | head -n 1)
            if [ -n "$MISSING" ]; then
              echo "🔧 [Kconfig] Заглушка для $MISSING"
              DIR_PATH=$(dirname "$MISSING")
              [ -L "$DIR_PATH" ] && rm -f "$DIR_PATH"
              mkdir -p "$DIR_PATH"
              touch "$MISSING"
              touch "$DIR_PATH/Makefile"
            else
              echo "❌ Ошибка Kconfig:"
              cat make_def.log
              exit 1
            fi
            
            if [ $COUNTER -gt 100 ]; then exit 1; fi
          done
          
          echo "2. Самовосстанавливающаяся компиляция ядра..."
          COUNTER2=0
          while true; do
            COUNTER2=$((COUNTER2+1))
            
            # Временно отключаем прерывание bash при ошибках
            set +e
            make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- > make_build.log 2>&1
            BUILD_STATUS=$?
            set -e
            
            if [ $BUILD_STATUS -eq 0 ]; then
              echo "✅ [Попытка $COUNTER2] Ядро успешно скомпилировано!"
              break
            fi
            
            # Ищем ошибки
            MISSING_HEADER=$(grep -oP "fatal error: ['\"]\K[^'\"]+(?=['\"] file not found)" make_build.log | head -n 1)
            MISSING_MAKE=$(grep -oP "No rule to make target '(?:\.\./)?\K[^']+(?=/Makefile')" make_build.log | head -n 1)
            
            if [ -n "$MISSING_HEADER" ]; then
              HEADER_NAME=$(basename "$MISSING_HEADER")
              
              # Вычисляем правильный путь
              if [[ "$MISSING_HEADER" == ../* ]]; then
                TARGET_PATH="${MISSING_HEADER#../}"
              else
                TARGET_PATH="include/$MISSING_HEADER"
              fi
              
              TARGET_DIR="$(dirname "$TARGET_PATH")"
              
              # УМНАЯ ЗАЩИТА: удаляем файл/симлинк, если он мешает создать папку
              if [ -e "$TARGET_DIR" ] || [ -L "$TARGET_DIR" ]; then
                if [ ! -d "$TARGET_DIR" ]; then
                  rm -f "$TARGET_DIR"
                fi
              fi
              
              mkdir -p "$TARGET_DIR"
              
              # ИЩЕМ ОРИГИНАЛ У ВЕНДОРА
              FOUND_IN_VENDOR=$(find vendor -type f -name "$HEADER_NAME" | head -n 1)
              
              if [ -n "$FOUND_IN_VENDOR" ]; then
                echo "🔧 [Header] Оригинал найден у вендора: $FOUND_IN_VENDOR -> $TARGET_PATH"
                cp "$FOUND_IN_VENDOR" "$TARGET_PATH"
              else
                echo "🔧 [Header] Оригинал не найден! Создаем умную C-заглушку: $TARGET_PATH"
                cat << 'EOF_HDR' > "$TARGET_PATH"
          /* Auto-generated smart dummy header */
          #ifndef AUTO_DUMMY_H
          #define AUTO_DUMMY_H
          #define KERNEL_MM_INIT_DONE 1
          #define KERNEL_LOCAL_IRQ_ENABLE 2
          #define KERNEL_DELAYACCT_INIT_DONE 3
          #define KERNEL_DRIVER_INIT_DONE 4
          #define KERNEL_DO_INITCALLS_DONE 5
          #define KERNEL_INIT_DONE 6
          #define KERNEL_DO_BASIC_SETUP_DONE 7
          static inline void phx_set_boot_stage(int stage) {}
          static inline void cgroup_set_sched_assist_boost_task(void *task) {}
          #endif
          EOF_HDR
              fi
              
            elif [ -n "$MISSING_MAKE" ]; then
              echo "🔧 [Makefile] Умное исправление: заглушаем директорию $MISSING_MAKE"
              
              # УМНАЯ ЗАЩИТА для Makefiles
              if [ -e "$MISSING_MAKE" ] || [ -L "$MISSING_MAKE" ]; then
                if [ ! -d "$MISSING_MAKE" ]; then
                  rm -f "$MISSING_MAKE"
                fi
              fi
              
              mkdir -p "$MISSING_MAKE"
              echo -e "obj-y := \nobj-m := \n" > "$MISSING_MAKE/Makefile"
              
            else
              echo "❌ Критическая ошибка компиляции:"
              grep -iE "error:|undefined reference|no rule to make" make_build.log | head -n 20
              echo "--- Последние 50 строк лога ---"
              tail -n 50 make_build.log
              exit 1
            fi
            
            if [ $COUNTER2 -gt 150 ]; then
              echo "❌ Лимит попыток компиляции исчерпан!"
              exit 1
            fi
          done
      
      - name: Locate Compiled Image
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "IMAGE_PATH=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "IMAGE_PATH=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "IMAGE_PATH=out/arch/arm64/boot/Image" >> $GITHUB_ENV
          else
            echo "::error::Скомпилированное ядро не найдено!"
            exit 1
          fi

      - name: Pack Kernel into AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp ${{ env.IMAGE_PATH }} AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=RMX3357/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bitra/' anykernel.sh
          
          zip -r9 ../Kernel_SukiSU_GT_Neo_2T.zip * -x .git README.md

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Realme-GT-Neo-2T
          path: Kernel_SukiSU_GT_Neo_2T.zip
