name: Build Realme GT Neo 2T Kernel (SukiSU Ultra)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Имя defconfig-файла'
        required: true
        default: 'k6893v1_64_k419_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Clone Vendor Source & Fix Kconfigs
        run: |
          echo "1. Скачиваем репозиторий vendor-source..."
          git clone --depth=1 https://github.com/realme-kernel-opensource/realme_X7max_GTneo_GTneo2T-AndroidT-vendor-source vendor_tmp
          
          # Распаковываем vendor
          if [ -d "vendor_tmp/vendor" ]; then
            cp -r vendor_tmp/vendor .
          else
            cp -r vendor_tmp vendor
          fi
          rm -rf vendor_tmp

          # 2. Удаляем старый/битый kernel/sched_assist, если он существует
          rm -rf kernel/sched_assist

          # 3. Находим sched_assist и копируем его на нужное место
          SCHED_PATH=$(find vendor -type d -name "sched_assist" | head -n 1)
          if [ -n "$SCHED_PATH" ]; then
            echo "Найдена директория sched_assist: $SCHED_PATH"
            mkdir -p kernel
            cp -r "$SCHED_PATH" kernel/sched_assist
          else
            echo "sched_assist не найден, создаем пустую заглушку Kconfig..."
            mkdir -p kernel/sched_assist
            touch kernel/sched_assist/Kconfig
          fi

      - name: Setup Toolchain (Proton Clang)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang
          # Удаляем старый компоновщик ld, чтобы не конфликтовал с системным ld в Ubuntu
          rm -f toolchain/clang/bin/ld

      - name: Inject SukiSU Ultra Driver & Defconfig Parameters
        run: |
          # 1. Инжектим драйвер SukiSU Ultra
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

          # 2. Корректируем defconfig
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "::error::Файл $DEFCONFIG_PATH не найден! Проверьте путь."
            exit 1
          fi

          echo "" >> $DEFCONFIG_PATH
          echo "# SukiSU Ultra Flags" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KPROBES=n" >> $DEFCONFIG_PATH
          
          echo "Конфигурация SukiSU успешно применена к $DEFCONFIG_PATH"

      - name: Patch Missing OEM Files & Auto-Fix Kconfigs (Python Script)
        run: |
          cat << 'EOF' > fix_kconfigs.py
          import os
          import re
          import shutil

          # 1. Безопасное копирование вендорных модулей
          modules = [
              ("sched_assist", "kernel/sched_assist"),
              ("klockopt", "kernel/locking/klockopt"),
              ("rootguard", "arch/arm64/kernel/rootguard")
              ("uxio_first", "block/uxio_first")
          ]

          for mod_name, target_path in modules:
              found_dir = None
              for root, dirs, files in os.walk("vendor"):
                  if mod_name in dirs:
                      found_dir = os.path.join(root, mod_name)
                      break
              
              if found_dir:
                  print(f"[VENDOR] Найдено {mod_name}: {found_dir} -> {target_path}")
                  # Удаляем прошлый файл или папку, если они уже есть
                  if os.path.exists(target_path) or os.path.islink(target_path):
                      if os.path.isdir(target_path) and not os.path.islink(target_path):
                          shutil.rmtree(target_path)
                      else:
                          os.remove(target_path)
                  
                  os.makedirs(os.path.dirname(target_path), exist_ok=True)
                  shutil.copytree(found_dir, target_path)

          # 2. Генерация заглушек для всех отсутствующих Kconfig
          print("[KCONFIG] Сканирование файлов конфигурации...")
          for root, dirs, files in os.walk("."):
              if any(ignored in root for ignored in ["out", ".git", "toolchain", "vendor_tmp"]):
                  continue
              for file in files:
                  if "Kconfig" in file:
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                              for line in f:
                                  match = re.search(r"^\s*(?:source|rsource)\s+[\"']?([^\"'\s\n]+)", line)
                                  if match:
                                      target_path = match.group(1).strip()
                                      if "$" in target_path:
                                          continue
                                      clean_path = os.path.normpath(target_path)
                                      if not os.path.exists(clean_path):
                                          print(f"[FIX] Создаем заглушку: {clean_path}")
                                          os.makedirs(os.path.dirname(clean_path), exist_ok=True)
                                          open(clean_path, "a").close()
                                          mf = os.path.join(os.path.dirname(clean_path), "Makefile")
                                          if not os.path.exists(mf):
                                              open(mf, "a").close()
                      except Exception as e:
                          pass
          EOF

          # Запуск и очистка файла скрипта
          python3 fix_kconfigs.py
          rm -f fix_kconfigs.py
      
      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          mkdir -p out
          
          echo "1. Самовосстанавливающаяся генерация .config..."
          # Этот цикл сам исправит любые отсутствующие Kconfig файлы
          while true; do
            make O=out ARCH=arm64 ${{ github.event.inputs.defconfig }} > make_def.log 2>&1
            
            if [ $? -eq 0 ]; then
              echo "✅ defconfig успешно сгенерирован!"
              break
            fi
            
            # Ищем, на какой именно файл ругается make
            MISSING=$(grep -oP 'can.t open file "\K[^"]+' make_def.log | head -n 1)
            
            if [ -n "$MISSING" ]; then
              echo "🔧 Умное исправление: создаем заглушку для $MISSING"
              mkdir -p "$(dirname "$MISSING")"
              touch "$MISSING"
              touch "$(dirname "$MISSING")/Makefile"
            else
              echo "❌ Критическая ошибка make (не связана с отсутствием файлов):"
              cat make_def.log
              exit 1
            fi
          done
          
          echo "2. Запуск компиляции ядра..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Locate Compiled Image
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "IMAGE_PATH=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "IMAGE_PATH=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "IMAGE_PATH=out/arch/arm64/boot/Image" >> $GITHUB_ENV
          else
            echo "::error::Скомпилированное ядро не найдено!"
            exit 1
          fi

      - name: Pack Kernel into AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp ${{ env.IMAGE_PATH }} AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=RMX3357/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bitra/' anykernel.sh
          
          zip -r9 ../Kernel_SukiSU_GT_Neo_2T.zip * -x .git README.md

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Realme-GT-Neo-2T
          path: Kernel_SukiSU_GT_Neo_2T.zip
